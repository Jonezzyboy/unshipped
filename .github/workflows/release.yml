name: Release

# Releases cut from unshipped itself go through the GitHub API, which fires
# `release` but not `push: tags` — so the tag-push trigger would never run.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

jobs:
  bundle:
    runs-on: macos-15
    steps:
      - name: Resolve tag
        id: tag
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check manifests match the tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          crate=$(awk -F'"' '/^version = /{ print $2; exit }' src-tauri/Cargo.toml)
          fail=0
          for pair in "tauri.conf.json:$conf" "package.json:$pkg" "Cargo.toml:$crate"; do
            if [ "${pair#*:}" != "$VERSION" ]; then
              echo "::error::${pair%%:*} is ${pair#*:}, tag says $VERSION"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || { echo "Run scripts/set-version.sh $VERSION and retag."; exit 1; }

      - run: npm ci

      - run: npm run bundle

      # Without a re-seal the copied bundle reads as "damaged" and refuses to
      # open at all; ad-hoc leaves the normal unidentified-developer prompt.
      - name: Ad-hoc sign
        run: codesign --force --deep --sign - src-tauri/target/release/bundle/macos/unshipped.app

      - run: sh scripts/bundle-dmg.sh

      - name: Attach DMG to the release
        id: dmg
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          dmg="src-tauri/target/release/bundle/dmg/unshipped_${VERSION}_arm64.dmg"
          test -f "$dmg" || { echo "::error::no DMG at $dmg"; exit 1; }
          gh release upload "$TAG" "$dmg" --clobber
          echo "sha256=$(shasum -a 256 "$dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update the Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN secret is unset — the cask would stay on the old version."
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:$TAP_TOKEN@github.com/Jonezzyboy/homebrew-unshipped.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$SHA256/g" \
            packaging/cask.rb.tmpl > tap/Casks/unshipped.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/unshipped.rb
          if git diff --cached --quiet; then
            echo "Cask already at $VERSION."
          else
            git commit -m "unshipped $VERSION"
            git push
          fi
