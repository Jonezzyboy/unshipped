<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unshipped</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <!-- Sign-in -->
      <section id="view-login" class="view" hidden>
        <div class="login-card">
          <h1 class="wordmark">unshipped<span class="mark-dot">.</span></h1>
          <p class="login-lede">See which of your repos have commits waiting on a release, and cut the next version.</p>
          <p class="hint">Uses the GitHub CLI’s login — whatever <span class="mono">gh</span> can see, this app can see.</p>
          <p id="login-error" class="error" hidden></p>
          <button id="btn-retry" class="primary">Retry</button>
        </div>
      </section>

      <!-- Repo ledger -->
      <section id="view-repos" class="view" hidden>
        <header class="topbar">
          <h1 class="wordmark">unshipped<span class="mark-dot">.</span></h1>
          <input id="search" placeholder="Filter repos…" spellcheck="false" />
          <div class="topbar-right">
            <button id="btn-refresh" class="ghost" title="Reload repos">Refresh</button>
            <img id="avatar" class="avatar" alt="" />
            <span id="username" class="mono"></span>
          </div>
        </header>
        <div class="filterbar">
          <div class="chips" id="owner-chips" role="group" aria-label="Filter by owner"></div>
          <span class="chip-divider" aria-hidden="true"></span>
          <div class="chips" id="status-chips" role="group" aria-label="Filter by status"></div>
        </div>
        <p id="repo-summary" class="summary"></p>
        <ul id="repo-list" class="ledger"></ul>
      </section>
    </div>

    <!-- Release dialog -->
    <dialog id="release-dialog">
      <form method="dialog" class="release">
        <header class="release-head">
          <h2 id="rel-title" class="mono"></h2>
          <button value="close" class="ghost" type="submit">Close</button>
        </header>
        <div id="rel-loading" class="hint">Reading commits since the last release…</div>
        <div id="rel-body" hidden>
          <p id="rel-reason" class="hint"></p>
          <div id="bump-choices" class="bumps" role="radiogroup" aria-label="Version bump"></div>
          <details id="rel-commits-wrap">
            <summary id="rel-commits-summary"></summary>
            <ul id="rel-commits" class="commits mono"></ul>
          </details>
          <label class="field">
            <span>Release title</span>
            <input id="rel-name" spellcheck="false" />
          </label>
          <label class="field">
            <span>Release notes <em id="notes-status"></em></span>
            <textarea id="rel-notes" rows="12" spellcheck="false"></textarea>
          </label>
          <p id="rel-error" class="error" hidden></p>
          <footer class="release-foot">
            <button id="btn-create-release" class="primary" type="button">Create release</button>
            <a id="rel-done-link" target="_blank" hidden>View release on GitHub →</a>
          </footer>
        </div>
      </form>
    </dialog>
  </body>
</html>
